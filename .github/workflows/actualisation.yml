# Robot de mise à jour quotidienne.
# Il tourne sur les serveurs de GitHub, gratuitement, même Mac éteint.
name: Actualisation quotidienne des marchés

on:
  # Tous les jours à 6h00 (heure de Paris ≈ 4h UTC l'été, 5h l'hiver).
  schedule:
    - cron: "0 4 * * *"
  # Bouton "Run workflow" pour déclencher à la main quand tu veux tester.
  workflow_dispatch:

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la mise à jour
        run: python 04_maj.py

      - name: Publier les données fraîches
        run: |
          git config user.name "robot-maj"
          git config user.email "robot-maj@users.noreply.github.com"
          git add data/opportunites.parquet data/derniere_maj.json
          # "git commit" échoue s'il n'y a rien de nouveau : on l'ignore proprement.
          git commit -m "Mise à jour automatique $(date +%F)" || echo "Aucun changement aujourd'hui"
          git push
